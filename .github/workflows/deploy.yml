name: Deploy Astro site

on:
  push:
    branches:
      - source
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Type-check Astro
        run: bunx astro check

      - name: Build
        env:
          # The telemetry service runs on the EC2 VPS, not next to the
          # GitHub Pages build. Point the client at it explicitly.
          PUBLIC_OPS_PULSE_API: https://ops.gilbert.keycasey.com/api/ops-pulse
        run: bun run build

      - name: Publish dist to master
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: master
          publish_dir: ./dist
          force_orphan: false
